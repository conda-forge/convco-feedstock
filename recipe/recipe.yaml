context:
  version: "0.7.2"

package:
  name: convco
  version: ${{ version }}

source:
  url: https://github.com/convco/convco/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b73c702e93e9e29f9b57faf497e812a94edb773e2f7d67d7b0481b03464f1b24

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cmake
    - make

tests:
  - script:
      - convco --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Conventional commits, changelog, versioning, validation
  homepage: https://github.com/convco/convco
  repository: https://github.com/convco/convco

extra:
  recipe-maintainers:
    - danielnachun
