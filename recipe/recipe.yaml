context:
  version: "0.7.1"

package:
  name: convco
  version: ${{ version }}

source:
  url: https://github.com/convco/convco/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 62cdc7f5797d33ed42c0919789ed49d00816985fff414d1490dcc705d8a7fead

build:
  number: 0

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cmake
    - make

tests:
  - script:
      - convco --help

about:
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Conventional commits, changelog, versioning, validation
  homepage: https://github.com/convco/convco
  repository: https://github.com/convco/convco

extra:
  recipe-maintainers:
    - danielnachun
